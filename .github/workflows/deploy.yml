# Tests, builds and publishes the app to https://trainer.jimmiller.dev/ on every
# push to main: a Worker serving the built files, behind the Homestead login
# (Cloudflare Access). The token and account id come from the organization.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Refuse to publish before the login is in front
        if: vars.WILDCARD_ACCESS != 'true' || vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Needs the organization variables CLOUDFLARE_ACCOUNT_ID and WILDCARD_ACCESS=true (Homestead README, 'Setup')."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /
      - run: npx --yes wrangler@4 deploy
      - name: Assert the app is not public
        run: |
          url=https://trainer.jimmiller.dev/
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$url" || true)
            [ "$code" != 000 ] && break; sleep 10
          done
          echo "anonymous GET $url -> $code"
          case "$code" in
            2??) echo "::error::$url answered $code without login. Taking it down."; npx --yes wrangler@4 delete --force; exit 1 ;;
            30?) ;;
            000) echo "::warning::$url did not answer yet; re-run to check." ;;
            *) echo "::error::$url answered $code."; exit 1 ;;
          esac
